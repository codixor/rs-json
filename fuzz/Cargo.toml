[package]
name = "rs-json-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0.154"
rs-json = { path = "..", features = ["read", "pointer", "serde"] }

[[bin]]
name = "differential"
path = "fuzz_targets/differential.rs"
test = false
doc = false

